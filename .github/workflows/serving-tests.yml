name: CPU model serving
on: [push, pull_request]
jobs:
  serving:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install CPU runtime
        run: |
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6 scipy==1.17.1 pandas==3.0.5 pillow==12.3.0 fastapi==0.141.1 python-multipart==0.0.32 httpx==0.28.1 pytest==9.1.1
      - name: Test checkpoint serving and review exports
        run: python -m pytest -q --junitxml=artifacts/serving-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serving-test-results
          path: artifacts/serving-tests.xml
